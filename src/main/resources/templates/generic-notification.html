<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Notification</title>
</head>

<body style="margin:0; padding:0; background:#f3f5f9; font-family:Arial, Helvetica, sans-serif;">

<table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0; background:#f3f5f9;">
    <tr>
        <td align="center">

            <!-- MAIN CARD -->
            <table width="640" cellpadding="0" cellspacing="0"
                   style="background:#ffffff; border-radius:10px; border:1px solid #e0e4ec;">

                <!-- OUTLOOK-SAFE GRADIENT BAR -->
                <tr>
                    <td style="height:8px; padding:0; margin:0; line-height:8px;">

                        <!--[if gte mso 9]>
                        <v:rect xmlns:v="urn:schemas-microsoft-com:vml"
                                fill="true" stroke="false"
                                style="width:640px;height:8px;">
                            <v:fill type="gradient" angle="90"
                                    color="#0A1A44"
                                    color2="#1A4DFF" />
                        </v:rect>
                        <![endif]-->

                        <div style="background:linear-gradient(90deg, #0A1A44, #3B0E57, #1A4DFF);
                                    height:8px; width:100%;">
                        </div>

                    </td>
                </tr>

                <!-- HEADER -->
                <tr>
                    <td style="padding:32px 40px 20px;">
                        <h2 style="margin:0; font-size:22px; color:#0A1A44; font-weight:700;"
                            th:text="${title}">
                            Notification Title
                        </h2>

                        <p style="margin:8px 0 0; font-size:14px; color:#666;">
                            Notification from Paves Leave Management System
                        </p>
                    </td>
                </tr>

                <!-- BODY -->
                <tr>
                    <td style="padding:10px 40px 30px; font-size:15px;
                               color:#444; line-height:1.7;">

                        <!-- Greeting -->
                        <p style="margin:0 0 18px;"
                           th:text="'Dear ' + ${recipientName} + ','">
                            Dear User,
                        </p>

                        <!-- Main message -->
                        <p style="margin:0 0 25px;"
                           th:utext="${messageBody}">
                            This is a notification from the system.
                        </p>

                        <!-- Optional Details Section -->
                        <div th:if="${details != null and not #maps.isEmpty(details)}">

                            <!-- Section Title -->
                            <div style="margin:0 0 15px;">
                                <div style="font-size:15px; font-weight:700; color:#0A1A44;
                                            border-left:4px solid #1A4DFF; padding-left:10px;"
                                     th:text="${detailsTitle}">
                                    Details
                                </div>
                            </div>

                            <!-- Details Box -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                   style="background:#fafbff; border:1px solid #e2e6ef;
                                          border-radius:8px;">
                                <tr>
                                    <td style="padding:20px 25px;">
                                        <table width="100%" cellpadding="0" cellspacing="0"
                                               style="font-size:14px; color:#333;">
                                            <tr th:each="detail : ${details}">
                                                <td style="padding:8px 0; width:150px; font-weight:bold;"
                                                    th:text="${detail.key}"></td>
                                                <td style="padding:8px 0;"
                                                    th:text="${detail.value}"></td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                        </div>

                        <!-- Closing message -->
                        <p th:if="${closingMessage != null}"
                           style="margin:25px 0 10px; color:#555;"
                           th:text="${closingMessage}">
                            Please log in to the system for more details.
                        </p>
                        <!-- CTA BUTTON -->
                        <div style="text-align:center; margin:32px 0;">
                            <a href="https://d2id2c6d521acd.cloudfront.net"
                               style="
           background:#0A1A44;
           padding:12px 32px;
           color:#ffffff !important;
           font-weight:600;
           font-size:15px;
           border-radius:6px;
           text-decoration:none;
           display:inline-block;
           border:1px solid #1A4DFF;
           font-family:Arial, Helvetica, sans-serif;
       ">
                                View in Leave Management System
                            </a>
                        </div>



                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td style="background:#f6f7fb; text-align:center;
                               padding:14px; font-size:12px; color:#888;">
                        © 2024 Paves Global Infotech Private Limited. All rights reserved.
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>

</body>
</html>
