# Application
spring.application.name=${SPRING_APPLICATION_NAME:employee-leave-management}
server.port=${SERVER_PORT:9999}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQL8Dialect}

# Disable Flyway
spring.flyway.enabled=false

# Security
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

# Email Config
email.smtp.host=${EMAIL_SMTP_HOST}
email.smtp.port=${EMAIL_SMTP_PORT}
email.smtp.username=${EMAIL_SMTP_USERNAME}
email.smtp.password=${EMAIL_SMTP_PASSWORD}
email.smtp.auth=${EMAIL_SMTP_AUTH:true}
email.smtp.starttls=${EMAIL_SMTP_STARTTLS:true}
email.from.name=${EMAIL_FROM_NAME:Leave Management System}

# JPA Additional Properties
spring.jpa.properties.hibernate.bytecode.provider=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.enhancer.enableLazyInitialization=false

# Cache Configuration
spring.cache.type=${SPRING_CACHE_TYPE:redis}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}


