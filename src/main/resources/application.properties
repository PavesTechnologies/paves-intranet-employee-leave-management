email.default-from-address=pavestechnologies@outlook.com
email.default-from-name=PAVES Employee Leave Management
email.protocol=smtp


# Security Settings
email.tls-enabled=true
email.ssl-enabled=false
email.auth-enabled=true
email.start-tls-enabled=true


# Connection Timeouts (in milliseconds)
email.connection-timeout=30000
email.read-timeout=30000
email.write-timeout=30000

# Connection Pool Configuration
email.pool-size=10
email.max-pool-size=20
email.pool-timeout=60000

# Async Thread Pool Configuration
email.async-core-pool-size=5
email.async-max-pool-size=20
email.async-queue-capacity=100
email.async-thread-name-prefix=email-async-

# Retry Configuration
email.max-retry-attempts=3
email.retry-delay-ms=5000

# Email Validation
email.strict-email-validation=true
email.email-validation-regex=^[A-Za-z0-9+_.-]+@([A-Za-z0-9.-]+\\.[A-Za-z]{2,})$

# Rate Limiting
email.max-emails-per-minute=60
email.max-emails-per-hour=1000

# Debug and Logging
email.debug-enabled=false
email.log-email-content=false


spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
