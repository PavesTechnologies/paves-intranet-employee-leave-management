version: '3.8'

services:

  lms:
    build: .
    container_name: lms-app
    ports:
      - "9999:9999"
    image: pavesadmin/intranet-lms:latest
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - cdc-network

networks:
  cdc-network:
    external: true
    name: cdc-network

